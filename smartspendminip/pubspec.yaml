name: smartspendminip
description: A new Flutter project for expense tracking and SMS analysis.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- UI and Icons ---
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.1
  fl_chart: ^0.66.0

  # --- Permissions and SMS ---
  permission_handler: ^11.3.0
  flutter_sms_inbox: ^1.0.2
  notification_listener_service: any

  # --- Machine Learning ---
  tflite_flutter: ^0.10.0
  intl: ^0.19.0 

  # --- Backend & Auth ---
  supabase_flutter: ^2.8.0
  another_telephony: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # --- ASSETS REGISTRATION ---
  assets:
    - assets/classifier.tflite
    - assets/vocab.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "web/smartspendlogo.png"